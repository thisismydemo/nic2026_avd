name: avd-images-azure
description: Azure Image Builder templates and build runner for the AVD Azure image gallery
scope: avd
tools: [bicep, terraform, powershell]
depends_on: [lz-avd]

inputs:
  - { name: org, type: string, description: "Organization identifier.", required: true, source: environment }
  - { name: lab_token, type: string, description: "Lab token.", required: true, source: environment, path: token }
  - { name: location, type: string, description: "Azure deployment region.", required: true, source: environment }
  - { name: location_short, type: string, description: "Short region identifier.", required: true, source: environment }
  - { name: tenant_id, type: string, description: "Microsoft Entra tenant ID.", required: true, source: environment }
  - { name: subscription_id_avd, type: string, description: "AVD subscription ID.", required: true, source: environment }
  - { name: resource_group_name, type: string, description: "Existing image resource group (Terraform; Bicep deploys into the group chosen by the wrapper).", required: true, source: generated }
  - { name: tags, type: map, description: "Resource tags.", required: true, source: environment }
  - { name: names, type: map, description: "Generated resource-name catalog.", required: true, source: generated }
  - { name: templates, type: list, description: "Two generated template specs {key, name, image_definition_id, distribute_vhd, run_output_name, gallery_run_output}: the Azure realm and the Azure Local realm.", required: true, source: generated }
  - { name: aib_identity_id, type: string, description: "Image Builder user-assigned identity resource ID (lz-avd output).", required: true, source: generated }
  - { name: subnet_imgbuild_id, type: string, description: "Image-build subnet resource ID (lz-avd output).", required: true, source: generated }
  - { name: source_publisher, type: string, description: "Platform image publisher.", required: true, source: environment, path: images.aib_source_image.publisher }
  - { name: source_offer, type: string, description: "Platform image offer.", required: true, source: environment, path: images.aib_source_image.offer }
  - { name: source_sku, type: string, description: "Platform image SKU.", required: true, source: environment, path: images.aib_source_image.sku }
  - { name: source_version, type: string, description: "EXACT platform image version resolved by scripts/Get-PlatformImageVersion.ps1; never 'latest'.", required: true, source: generated }
  - { name: build_vm_size, type: string, description: "Image-build VM size.", required: true, source: environment, path: images.build_vm_size }
  - { name: os_disk_size_gb, type: int, description: "Image-build OS disk size in GB.", required: true, source: environment, path: images.os_disk_size_gb }
  - { name: build_timeout_minutes, type: int, description: "AIB build timeout in minutes.", required: false, default: 120, source: environment }
  - { name: replication_regions, type: list, description: "Gallery replication regions (one region: a second region is a slide).", required: true, source: environment, path: images.replication_regions }
  - { name: shortpath_port, type: int, description: "Shortpath UDP listener port.", required: true, source: environment, path: shortpath_managed_port }
  - { name: defender_paths, type: string, description: "Semicolon-separated local Defender path exclusions.", required: false, default: "", source: environment }
  - { name: defender_processes, type: string, description: "Semicolon-separated local Defender process exclusions.", required: false, default: "", source: environment }
  - { name: vdot_archive_uri, type: string, description: "Pinned VDOT ZIP URI, or empty to skip.", required: false, default: "", source: environment }
  - { name: vdot_archive_sha256, type: string, description: "Expected SHA-256 of the VDOT ZIP.", required: false, default: "", source: environment }
  - { name: install_teams_app, type: string, description: "'true' provisions new Teams; 'false' for the Microsoft 365 marketplace source.", required: false, default: "false", source: environment }
  - { name: disable_teams_autoupdate, type: string, description: "'true' disables Teams automatic updates.", required: false, default: "false", source: environment }

outputs:
  - { name: template_ids, type: list, description: "Image Builder template resource IDs." }
  - { name: template_names, type: list, description: "Image Builder template names." }
  - { name: gallery_image_version_ids, type: list, description: "Gallery image version IDs recorded after Start-ImageBuild.ps1." }

secrets: []
destroy: supported

names:
  it_azure: { type: it, purpose: azure }
  it_azl: { type: it, purpose: azl }
  runout_azure: { type: runout, purpose: azure }
  runout_azl_gallery: { type: runout, purpose: azl-gallery }
  runout_azl_vhd: { type: runout, purpose: azl-vhd }
  deployment_name: { type: dep, purpose: avd-images-azure }
